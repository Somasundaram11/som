<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 100px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 5px;
      cursor: pointer;
    }
    .result {
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Simple Calculator</h2>

  <input type="number" id="num1" placeholder="Enter number 1">
  <input type="number" id="num2" placeholder="Enter number 2"><br>

  <button onclick="performOperation('+')">+</button>
  <button onclick="performOperation('-')">−</button>
  <button onclick="performOperation('*')">×</button>
  <button onclick="performOperation('/')">÷</button>

  <div class="result" id="result"></div>

  <script>
    function performOperation(operator) {
      const num1 = parseFloat(document.getElementById("num1").value);
      const num2 = parseFloat(document.getElementById("num2").value);
      let result = document.getElementById("result");

      // Check if both numbers are provided
      if (isNaN(num1) || isNaN(num2)) {
        result.textContent = "Please enter both numbers.";
        return;
      }

      // Perform the operation
      switch (operator) {
        case '+':
          result.textContent = `Result: ${num1 + num2}`;
          break;
        case '-':
          result.textContent = `Result: ${num1 - num2}`;
          break;
        case '*':
          result.textContent = `Result: ${num1 * num2}`;
          break;
        case '/':
          // Handle division by zero
          if (num2 === 0) {
            result.textContent = "Error: Cannot divide by zero.";
          } else {
            result.textContent = `Result: ${num1 / num2}`;
          }
          break;
        default:
          result.textContent = "Invalid operation.";
      }
    }
  </script>

</body>
</html>
